name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Typecheck
      run: npm run typecheck

    - name: Lint
      run: npm run lint
      continue-on-error: true # Not configured strictly yet

    - name: Build
      run: npm run build
      continue-on-error: true # Not fully configured for all workspaces yet
