<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}a{color:inherit}.shell{display:grid;grid-template-columns:255px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--border);padding:25px 14px}.brand{padding:3px 15px 24px;display:flex;gap:13px;align-items:center}.brandMark{width:43px;height:43px;border:1px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-size:23px}.brand strong{font-family:Georgia,serif;font-size:23px;letter-spacing:-.8px}.brand small{display:block;font-size:10px;letter-spacing:2.4px;color:var(--muted);margin-top:3px;text-transform:uppercase}.group{font-size:10px;letter-spacing:2px;margin:22px 15px 8px;color:var(--muted);text-transform:uppercase}.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;padding:12px 13px;border-radius:11px;color:var(--muted);font-size:13px}.nav span{font-size:16px;width:21px;text-align:center}.nav:hover,.nav.active{background:var(--surface2);color:var(--text)}.nav.active{box-shadow:inset 3px 0 var(--accent);font-weight:700}.sidebarfoot{padding:18px 12px 12px;color:var(--muted);font-size:11px;line-height:1.7}.main{min-width:0}.top{padding:15px clamp(18px,3vw,43px);display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--border);background:var(--surface)}.top .crumb{font-size:12px;color:var(--muted)}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top select,.pillBtn{border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);padding:9px 12px;font-size:12px}.avatar{width:35px;height:35px;background:var(--accent);color:var(--accentText);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px}.content{padding:clamp(17px,3vw,43px);max-width:1580px;margin:auto}.demo{border:1px solid #bf985e88;background:color-mix(in srgb,var(--gold) 12%,var(--surface));padding:11px 15px;border-radius:10px;font-size:12px;color:var(--text);line-height:1.6}.head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:26px 0}.eyebrow{letter-spacing:2px;text-transform:uppercase;font-size:10px;color:var(--accent);font-weight:800}.head h1{font-family:Georgia,serif;font-size:clamp(26px,3vw,41px);font-weight:500;letter-spacing:-1.2px;margin:8px 0 9px}.head p{margin:0;font-size:13px;color:var(--muted);max-width:730px;line-height:1.6}.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:9px;padding:10px 13px;font-size:12px;font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accentText)}.btn.warn{background:transparent;border-color:var(--red);color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tile,.panel{border:1px solid var(--border);border-radius:15px;background:var(--surface);box-shadow:var(--shadow)}.tile{padding:19px 18px}.tile .num{font-family:Georgia,serif;font-size:29px;line-height:1.1;margin:13px 0 9px}.tile .cap{font-size:11px;letter-spacing:.5px;color:var(--muted)}.tile small{display:block;font-size:11px;color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,.85fr);gap:15px;margin-top:16px}.panel{padding:19px;overflow:hidden}.panel h2{font-family:Georgia,serif;font-weight:500;font-size:20px;margin:0 0 5px}.sub{color:var(--muted);font-size:12px;line-height:1.6}.tableScroll{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:12px;margin-top:14px}.table th{text-transform:uppercase;font-size:9px;letter-spacing:1.3px;color:var(--muted);font-weight:700;text-align:left;padding:13px 10px;border-bottom:1px solid var(--border);white-space:nowrap}.table td{padding:15px 10px;border-bottom:1px solid var(--border);vertical-align:middle;min-width:80px}.table tr:last-child td{border-bottom:0}.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);padding:6px 9px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}.tag.ok{color:var(--green);background:color-mix(in srgb,var(--green) 8%,var(--surface))}.tag.warn{color:var(--amber);background:color-mix(in srgb,var(--gold) 10%,var(--surface))}.tag.bad{color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--surface))}.stack{display:grid;gap:11px;margin-top:16px}.notice{border:1px solid var(--border);background:var(--surface2);border-radius:11px;padding:15px;font-size:12px;line-height:1.65}.notice strong{display:block;font-size:12px}.notice p{color:var(--muted);margin:5px 0 0}.actionline{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.separator{height:1px;background:var(--border);margin:17px 0}.toggleRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--border)}.toggleRow:last-child{border:0}.toggleRow strong{font-size:12px}.toggleRow small{display:block;font-size:11px;color:var(--muted);margin-top:4px}.switch{border:1px solid var(--border);border-radius:999px;width:48px;height:26px;background:var(--surface2);padding:3px;flex-shrink:0}.switch:after{content:"";display:block;width:18px;height:18px;border-radius:50%;background:var(--muted)}.switch.on{background:var(--accent);border-color:var(--accent)}.switch.on:after{margin-left:20px;background:var(--accentText)}.switch:disabled{cursor:not-allowed;opacity:.55}#toast{position:fixed;right:20px;bottom:20px;border:1px solid var(--gold);background:var(--surface);color:var(--text);max-width:330px;padding:17px;border-radius:13px;box-shadow:var(--shadow);font-size:12px;line-height:1.5;display:none;z-index:10}#toast.show{display:block}.footer{font-size:11px;color:var(--muted);padding:26px 0 10px;line-height:1.5}.small{font-size:11px;color:var(--muted)}.divider{height:1px;background:var(--border);margin:20px 0}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:minmax(0,1fr)}}@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:14px;border-right:0;border-bottom:1px solid var(--border)}.brand{padding:0 3px 10px}.sidebar nav{display:flex;overflow-x:auto;gap:3px}.group,.sidebarfoot{display:none}.nav{min-width:115px;justify-content:center;padding:10px 8px;white-space:nowrap}.nav span{display:none}.top{flex-direction:column;align-items:flex-start}.head{align-items:start;flex-direction:column}.content{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:15px}.tile .num{font-size:23px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brandMark">◇</div><div><strong>Atelier</strong><small>Platform control</small></div></div><nav id="nav"></nav><div class="sidebarfoot" id="sidebarfoot">Prototype de console — identités, montants, pays et états fictifs.<br>Aucun fournisseur réel n'est activé.</div></aside><div class="main"><header class="top"><div class="crumb" id="crumb">Plateforme / Administration / Aperçu</div><div class="actions"><select id="lang" aria-label="Langue"><option value="fr">Français</option><option value="en">English</option></select><select id="theme" aria-label="Apparence"><option value="system">Système / System</option><option value="light">Clair / Light</option><option value="dark">Sombre / Dark</option></select><span class="tag warn" id="env">STAGING · DÉMO</span><span class="avatar">PO</span></div></header><main class="content"><div class="demo" id="demo"></div><div class="head"><div><div class="eyebrow" id="eyebrow">PLATFORM OPERATIONS / 01</div><h1 id="title">Vue d’ensemble</h1><p id="intro"></p></div><button class="btn primary" id="mainBtn">Examiner la file →</button></div><section class="grid" id="metrics"></section><section class="layout"><article class="panel"><h2 id="listTitle">À examiner</h2><p class="sub" id="listSub"></p><div class="tableScroll"><table class="table"><thead id="headers"></thead><tbody id="rows"></tbody></table></div></article><aside class="panel"><h2 id="asideTitle">Actions et garde-fous</h2><p class="sub" id="asideSub"></p><div class="stack" id="notices"></div><div class="separator"></div><div id="toggles"></div><div class="actionline"><button class="btn" id="docsBtn">Voir règles</button><button class="btn warn" id="pauseBtn">Pause d’urgence</button></div></aside></section><footer class="footer" id="footer"></footer></main></div></div><div id="toast" role="status" aria-live="polite"></div>
<script>
const GROUPS=[['Pilotage','Governance',[['A01','◈','Vue d’ensemble','Overview'],['A15','▥','Analyses','Analytics']]],['Personnes & commerce','People & commerce',[['A02','♙','Utilisateurs','Users'],['A03','▣','Boutiques','Merchants'],['A04','◇','Catalogue & modération','Catalog & moderation'],['A05','≡','Commandes','Orders'],['A14','◌','Support & litiges','Support & disputes']]],['Finance','Finance',[['A06','◫','Transactions','Transactions'],['A07','↗','Reversements & remboursements','Payouts & refunds'],['A08','♢','Revenus & tarifs','Revenue & pricing'],['A09','◉','Moyens de paiement','Payment methods'],['A10','◎','Pays & livraisons','Countries & delivery']]],['Configuration','Configuration',[['A11','◧','Modules & permissions','Feature controls'],['A12','✧','Intelligence artificielle','AI operations'],['A13','✉','Messages & politiques','Messages & policies']]],['Sécurité & exploitation','Security & operations',[['A16','⌁','Santé & maintenance','Health & maintenance'],['A17','♧','Équipe admin','Admin team'],['A18','□','Journal d’audit','Audit log']]]];
const cfg={A01:[['Utilisateurs / Users','Boutiques / Shops','Commandes / Orders','Alertes / Alerts'],['Demandes en attente','Paiements à examiner','Boutique à vérifier'],['Pilotage par exception','Les métriques affichent la fraîcheur et leur source.'],['Autorisation avant action','Chaque intervention sensible exige permission, raison et journal.']],A02:[['Comptes actifs','Comptes restreints','Demandes RGPD','Recours'],['Profil exemple A','Profil exemple B','Profil exemple C'],['Restriction proportionnée','Suspendre ne supprime pas les commandes déjà conclues.'],['Données privées','L’accès dépend du rôle, du dossier et du besoin.']],A03:[['Boutiques actives','Vérifications à revoir','Suspensions','Pays'],['Maison Démo','Atelier Test','Boutique Exemple'],['Vérification précise','Identité contrôlée ne garantit pas tous les articles.'],['Obligations existantes','Les commandes déjà payées restent suivies.']],A04:[['Offres publiées','Signalements','Numériques','Catégories'],['Annonce signalée A','Contenu numérique B','Catégorie C'],['Modération motivée','Une mesure conserve sa preuve et son recours.'],['Licence et accès','Dépublier ne détruit pas automatiquement un droit acquis.']],A05:[['Commandes créées','En traitement','Incidents','En attente'],['CMD-DEMO-012','CMD-DEMO-013','CMD-DEMO-014'],['États séparés','Paiement, commande, remise et litige ont des états distincts.'],['Historique immuable','Le prix accepté ne change pas avec la fiche publique.']],A06:[['Paiements confirmés','À rapprocher','En attente','Anomalies'],['PAY-DEMO-101','PAY-DEMO-102','PAY-DEMO-103'],['Source externe requise','Une capture client ne confirme jamais un paiement PSP.'],['Idempotence','Deux webhooks égaux ne créent qu’une opération logique.']],A07:[['Reversements en attente','Refunds demandés','Chargebacks','À approuver'],['REF-DEMO-017','PAY-DEMO-108','PAYOUT-DEMO-3'],['Statut véridique','Soumis au PSP n’est pas encore confirmé.'],['Double contrôle','L’initiateur ne valide pas sa propre demande sensible.']],A08:[['GMV démo','Revenu plateforme','Frais PSP','Coûts IA'],['Abonnement démo','Commission démo','Tarification future'],['Non-rétroactivité','Les accords antérieurs gardent leurs conditions.'],['Prix non validés','Aucun tarif réel n’est approuvé ici.']],A09:[['PSP configurés','Routes éligibles','Méthodes en pause','À prouver'],['Wallet exemple · Collecte','Carte exemple · Collecte','Play · Numérique'],['Sans preuve = OFF','Contrat, pays, catégorie, devise et canal requis.'],['Stop new ≠ effacement','Les paiements initiés continuent d’être traités.']],A10:[['Pays visibles','Corridors actifs','Routes suspendues','Livraisons'],['Zone exemple A','Zone exemple B','Zone exemple C'],['Portée ciblée','La visibilité internationale n’implique pas paiement universel.'],['Langue indépendante','FR/EN indépendants du pays et de la devise.']],A11:[['Modules configurés','Expériences actives','À examiner','Bloqués conformité'],['Demandes acheteur','Boutique numérique','IA aide'],['OFF restrictif','Le niveau global OFF prime sur le ciblage ON.'],['Conservation des droits','Couper le checkout ne supprime pas les achats existants.']],A12:[['Tâches IA','Coût simulé','Erreurs','Fallback manuel'],['Besoins assistés','Fiches brouillon','Modèle désactivé'],['Aucun engagement IA','Le modèle ne valide ni argent ni stock.'],['Arrêt IA ciblé','Acheter/vendre reste possible sans IA.']],A13:[['Modèles FR/EN','Politiques versionnées','À relire','Notifications'],['Confirmation paiement','Statut commande','CGV version exemple'],['Version contractuelle','La langue et la version acceptées restent retrouvables.'],['Consentement','Marketing distinct du transactionnel.']],A14:[['Dossiers ouverts','Réponses attendues','Appels','Escalades'],['CAS-DEMO-13','CAS-DEMO-14','CAS-DEMO-15'],['Attribution','Chaque cas a un responsable et une suite.'],['Aucune falsification','Support ne marque pas un paiement comme confirmé.']],A15:[['GMV','Revenu net','Commandes','Coût support'],['Funnel achat',' let lang='fr',theme='system',selected='A01',paused=false;const $=id=>document.getElementById(id);function tr(fr,en){return lang==='fr'?fr:en}function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3800)}function names(id){for(const g of GROUPS)for(const e of g[2])if(e[0]===id)return e;return GROUPS[0][2][0]}function render(){const effective=theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme;document.documentElement.dataset.theme=effective;document.documentElement.lang=lang;$('lang').value=lang;$('theme').value=theme;$('env').textContent=tr('STAGING · DÉMO','STAGING · DEMO');$('demo').innerHTML='◈ '+tr('<strong>Simulation UX uniquement.</strong> Tous les comptes, chiffres, statuts et moyens ci-dessous sont fictifs. Aucun paiement, vendeur ou configuration de production n’est modifié.','<strong>UX simulation only.</strong> All accounts, figures, states and payment methods below are fictional. No production payments, merchants or configuration is modified.');let nav='';for(const g of GROUPS){nav+=`<div class="group">${tr(g[0],g[1])}</div><nav>`;for(const e of g[2])nav+=`<button class="nav ${selected===e[0]?'active':''}" data-id="${e[0]}"><span>${e[1]}</span>${tr(e[2],e[3])}</button>`;nav+='</nav>'}$('nav').innerHTML=nav;document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>{selected=x.dataset.id;render()});const e=names(selected),c=cfg[selected];$('crumb').textContent='Atelier / '+tr('Administration','Administration')+' / '+tr(e[2],e[3]);$('eyebrow').textContent='PLATFORM OPERATIONS / '+selected;$('title').textContent=tr(e[2],e[3]);$('intro').textContent=tr('Console de gouvernance : données de démonstration, décisions traçables et activation conditionnée aux preuves.','Governance console: demo data, auditable decisions, and activation conditional on evidence.');$('mainBtn').textContent=tr('Examiner la file →','Review queue →');$('metrics').innerHTML=c[0].map((x,i)=>`<article class="tile"><div class="cap">${x}</div><div class="num">${['128','24','7','3'][i]}</div><small>${tr('Simulation · Données fictives','Simulation · Fictional data')}</small></article>`).join('');$('listTitle').textContent=tr('À examiner','Review queue');$('listSub').textContent=tr('Exemples pour valider la composition de la console, pas des dossiers réels.','Examples to validate layout; these are not real cases.');$('headers').innerHTML=`<tr><th>${tr('Référence','Reference')}</th><th>${tr('État','State')}</th><th>${tr('Priorité','Priority')}</th><th>${tr('Suite','Next step')}</th></tr>`;$('rows').innerHTML=c[1].map((x,i)=>`<tr><td><strong>${x}</strong><div class="small">DEMO-${selected}-${i+1}</div></td><td><span class="tag ${i===1?'warn':i===2?'bad':'ok'}">${tr(['À examiner','En attente','Bloqué'][i],['Review','Pending','Blocked'][i])}</span></td><td>${tr(['Normal','Élevé','Critique'][i],['Normal','High','Critical'][i])}</td><td><button class="btn sample">${tr('Ouvrir','Open')} ↗</button></td></tr>`).join('');$('asideTitle').textContent=tr('Actions & garde-fous','Actions & safeguards');$('asideSub').textContent=tr('Aucune commande de cette maquette n’écrit sur un serveur.','No action on this mockup writes to a server.');$('notices').innerHTML=[c[2],c[3]].map(x=>`<div class="notice"><strong>${x[0]}</strong><p>${x[1]}</p></div>`).join('');$('toggles').innerHTML=`<div class="toggleRow"><div><strong>${tr('Nouveaux paiements — simulation','New payments — simulation')}</strong><small>${tr('La pause n’affecte pas les transactions existantes.','Pause does not erase existing transactions.')}</small></div><button aria-label="Simulation pause" id="switch" class="switch ${paused?'':'on'}"></button></div><div class="toggleRow"><div><strong>${tr('Moyen non éligible','Ineligible payment method')}</strong><small>${tr('Activation interdite : preuves externes manquantes.','Activation blocked: missing external evidence.')}</small></div><button class="switch" disabled aria-label="Blocked"></button></div>`;$('switch').onclick=()=>{paused=!paused;toast(tr('Simulation locale uniquement : aucun prestataire modifié.','Local simulation only: no provider was modified.'));render()};$('docsBtn').textContent=tr('Lire les règles','Read safeguards');$('pauseBtn').textContent=tr('Pause d’urgence (démo)','Emergency pause (demo)');$('docsBtn').onclick=()=>toast(tr('Lire ADMIN_PANEL_PRD_ARCHITECTURE_UX_V1_0.md pour les contrats complets.','Read ADMIN_PANEL_PRD_ARCHITECTURE_UX_V1_0.md for full contracts.'));$('pauseBtn').onclick=()=>{paused=true;render();toast(tr('Simulation de pause : nouveaux paiements uniquement.','Simulated pause: new payments only.'))};$('mainBtn').onclick=()=>document.querySelector('.panel')?.scrollIntoView({behavior:'smooth'});document.querySelectorAll('.sample').forEach(x=>x.onclick=()=>toast(tr('Dossier fictif — aucune action serveur.','Fictional case — no server action.')));$('footer').textContent=tr('Conception haute fidélité indicative · FR/EN + clair/sombre · Accès admin réel à sécuriser côté serveur · A01–A18','Indicative high-fidelity design · FR/EN + light/dark · Real admin access must be secured on server · A01–A18')}
$('lang').onchange=e=>{lang=e.target.value;render()};$('theme').onchange=e=>{theme=e.target.value;render()};matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(theme==='system')render()});render();
</script></body></html>
