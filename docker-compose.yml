services:
  # ---------------------------------------------------------
  # PostgreSQL (Database)
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aifoundry-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aifoundry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # MinIO (S3 compatible object storage)
  # ---------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: aifoundry-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ---------------------------------------------------------
  # MinIO Client (Create buckets automatically)
  # ---------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-03-30T11-13-14Z
    container_name: aifoundry-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb -p myminio/aifoundry-assets &&
      /usr/bin/mc anonymous set public myminio/aifoundry-assets
      "

  # ---------------------------------------------------------
  # Mailpit (Email testing)
  # ---------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: aifoundry-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

  # ---------------------------------------------------------
  # Caddy (Reverse proxy / Local HTTPS)
  # ---------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: aifoundry-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
