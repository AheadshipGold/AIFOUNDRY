services:
  # ---------------------------------------------------------
  # PostgreSQL (Database)
  # ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aifoundry-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aifoundry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------
  # SeaweedFS (S3 compatible object storage)
  # ---------------------------------------------------------
  s3:
    image: chrislusf/seaweedfs:4.47
    container_name: aifoundry-s3
    command: ["server", "-dir=/data", "-s3"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-localadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-localdevsecret}
      S3_BUCKET: ${S3_BUCKET:-aifoundry-local}
    ports:
      - "8333:8333"
      - "9333:9333"
      - "23646:23646"
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  # ---------------------------------------------------------
  # Mailpit (Email testing)
  # ---------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: aifoundry-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    restart: unless-stopped

  # ---------------------------------------------------------
  # Caddy (Reverse proxy / Local HTTPS)
  # ---------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: aifoundry-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
  caddy_data:
  caddy_config:
